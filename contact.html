
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聯絡我們｜山林涼登山隊</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f0;
      color: #26352d;
      line-height: 1.8;
    }

    header, footer {
      background: #203d30;
      color: white;
      text-align: center;
      padding: 20px;
    }

    nav a {
      color: white;
      margin: 10px;
      text-decoration: none;
    }

    main {
      max-width: 650px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      height: 150px;
      resize: vertical;
    }

    button {
      margin-top: 25px;
      padding: 12px 30px;
      background: #203d30;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #365b46;
    }
  </style>
</head>

<body>

<header>
  <h1>山林涼登山隊</h1>

  <nav>
    <a href="index.html">首頁</a>
    <a href="about.html">團隊介紹</a>
    <a href="contact.html">聯絡我們</a>
  </nav>
</header>

<main>
  <h2>聯絡我們</h2>

  <p>
    如果您對登山活動有興趣，
    歡迎填寫以下資料與我們聯絡。
  </p>

  <form
    action="https://formsubmit.co/alex50115017@gmail.com"
    method="POST"
  >

    <input
      type="hidden"
      name="_subject"
      value="山林涼登山隊｜網站聯絡表單"
    >

    <input
      type="hidden"
      name="_url"
      value="https://alex50115017.github.io/myWeb/contact.html"
    >

    <input
      type="hidden"
      name="_template"
      value="table"
    >

    <label for="name">客戶姓名</label>
    <input
      type="text"
      id="name"
      name="name"
      placeholder="請輸入您的姓名"
      required
    >

    <label for="phone">電話</label>
    <input
      type="tel"
      id="phone"
      name="phone"
      placeholder="請輸入您的電話"
      required
    >

    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="請輸入您的電子郵件"
      required
    >

    <label for="message">聯絡內容</label>
    <textarea
      id="message"
      name="message"
      placeholder="請輸入您想詢問的內容"
      required
    ></textarea>

    <button type="submit">送出表單</button>

  </form>
</main>

<footer>
  <p>© 山林涼登山隊</p>
</footer>

</body>
</html>
