
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聯絡我們｜山林涼登山隊</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #26352d;
      background: #f3f6f0;
      line-height: 1.8;
    }
    header, footer {
      background: #203d30;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 12px;
    }
    main {
      max-width: 650px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
    }
    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }
    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #b8c6b9;
      border-radius: 6px;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      color: white;
      background: #2e5a40;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    @media (max-width: 700px) {
      main { margin: 16px; padding: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>山林涼登山隊</h1>
    <nav>
      <a href="index.html">首頁</a>
      <a href="contact.html">聯絡我們</a>
    </nav>
  </header>

  <main>
    <h2>聯絡我們</h2>
    <p>歡迎詢問登山行程、團體活動與合作資訊。</p>

    <<form action="https://formsubmit.co/alex50115017@gmail.com" method="POST">>
      <label for="name">客戶姓名 *</label>
      <input id="name" name="name" autocomplete="name" required>

      <label for="phone">聯絡電話 *</label>
      <input id="phone" name="phone" type="tel"
        autocomplete="tel" required>

      <label for="email">Email *</label>
      <input id="email" name="email" type="email"
        autocomplete="email" required>

      <label for="message">聯絡內容 *</label>
      <textarea id="message" name="message"
        rows="6" required></textarea>

      <button type="submit">送出聯絡資料</button>
      <p id="result" role="status"></p>
    </form>
  </main>

  <footer>
    <p>山林涼登山隊｜探索山林・安全同行</p>
  </footer>
</body>
</html>
