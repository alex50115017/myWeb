
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山林戶外用品店</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      color: #26352b;
      background: #f5f7f2;
      line-height: 1.7;
    }

    header {
      background: #244b37;
      color: white;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 { margin: 0; font-size: 24px; }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    .hero {
      padding: 80px 20px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #315e42, #91a77a);
    }

    .hero h2 { font-size: clamp(30px, 5vw, 48px); margin: 0 0 12px; }
    .hero p { font-size: 18px; }

    .products {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000010;
    }

    .card .emoji { font-size: 42px; }
    .card h3 { margin-bottom: 8px; }

    footer {
      text-align: center;
      padding: 20px;
      background: #244b37;
      color: white;
    }

    @media (max-width: 600px) {
      header { justify-content: center; text-align: center; }
      nav a { margin: 0 8px; }
      .hero { padding: 55px 18px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>山林戶外用品店</h1>
    <nav>
      <a href="#home">首頁</a>
      <a href="#products">商品介紹</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h2>探索山林，享受戶外</h2>
    <p>準備好裝備，出發尋找屬於你的風景。</p>
  </section>

  <main class="products" id="products">
    <h2>戶外裝備推薦</h2>
    <div class="cards">
      <article class="card">
        <div class="emoji">🎒</div>
        <h3>登山背包</h3>
        <p>收納登山必需品，讓每一趟旅程更加便利。</p>
      </article>
      <article class="card">
        <div class="emoji">⛺</div>
        <h3>露營帳篷</h3>
        <p>打造舒適的戶外休息空間，享受自然生活。</p>
      </article>
      <article class="card">
        <div class="emoji">🥾</div>
        <h3>登山鞋</h3>
        <p>為山徑旅程做好準備，踏出每一步。</p>
      </article>
    </div>
  </main>

  <footer>
    <p>山林戶外用品店｜探索自然，安全出發</p>
  </footer>
</body>
</html>
